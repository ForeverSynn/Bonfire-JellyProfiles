# lsheardo: build check for the Jellyfin 12.4 rebuild (Media-Serv). Upstream workflows only run on their own branches.
name: lsheardo 12.4 build
on:
  push:
    branches: ['lsheardo-*']
  pull_request:
    branches: ['lsheardo-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    # Data-leak check on every server-related repo (full history, pinned image).
    # .gitleaks.toml allows two upstream false positives (vendored-file hashes, an API docs example).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD":/src:ro -w /src zricethezav/gitleaks:v8.30.1 git . --redact --no-banner --exit-code 1 -c /src/.gitleaks.toml
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish Jellyfin.Profiles.csproj -c Release -o out -p:TreatWarningsAsErrors=false -p:BonfireTfm=net10.0

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-12.4
          path: out/
